<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港小學三年級 - 單元總結溫習神器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #E0F2FE;
            overflow-x: hidden;
        }
        .font-fredoka {
            font-family: 'Fredoka', cursive, 'Noto Sans TC', sans-serif;
        }
        .bg-pattern {
            background-image: radial-gradient(#0284C7 1.5px, transparent 1.5px), radial-gradient(#10B981 1.5px, #E0F2FE 1.5px);
            background-size: 36px 36px;
            background-position: 0 0, 18px 18px;
        }
        /* Lock screen visual aspect for high quality display */
        @media (orientation: portrait) and (max-width: 900px) {
            #portraitWarning {
                display: flex !important;
            }
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #BAE6FD;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #0284C7;
            border-radius: 6px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col bg-pattern select-none relative overflow-hidden">

    <!-- PORTRAIT WARNING OVERLAY (Shown only when mobile/tablet is in Portrait mode) -->
    <div id="portraitWarning" class="hidden fixed inset-0 bg-sky-900/95 z-50 flex-col items-center justify-center p-6 text-center text-white backdrop-blur-md">
        <div class="bg-amber-400 text-slate-900 p-6 rounded-full mb-6 animate-bounce shadow-2xl">
            <i class="fa-solid fa-mobile-screen-button text-6xl transform rotate-90"></i>
        </div>
        <h2 class="text-3xl font-black mb-3">請將螢幕旋轉至橫屏 📱🔄</h2>
        <p class="text-sky-200 text-lg font-bold max-w-md">為了獲得最佳的答題與大螢幕溫習體驗，請解鎖裝置的旋轉鎖定並將螢幕橫放喔！</p>
    </div>

    <!-- TOP NAVIGATION BAR -->
    <header class="bg-white/95 border-b-4 border-sky-300 shadow-md py-2.5 px-6 flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-amber-400 text-white px-3 py-2 rounded-2xl shadow-inner transform -rotate-2">
                <i class="fa-solid fa-graduation-cap text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-black text-sky-700 tracking-wide font-fredoka">小三單元總結溫習神器</h1>
                <p class="text-xs text-slate-500 font-bold hidden sm:block">Google Chrome 實時連線 ‧ 橫屏互動系統</p>
            </div>
        </div>

        <div id="navRightControls" class="flex items-center gap-3">
            <span id="roleBadge" class="hidden px-4 py-1.5 rounded-full text-sm font-black shadow-sm"></span>
            <button onclick="switchRole()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-xl font-bold text-sm border-2 border-slate-300 transition flex items-center gap-2">
                <i class="fa-solid fa-rotate"></i> 切換身份
            </button>
        </div>
    </header>

    <!-- MAIN LANDSCAPE CONTAINER -->
    <main class="flex-1 p-4 max-w-[1600px] w-full mx-auto flex flex-col justify-center overflow-hidden">

        <!-- ========================================== -->
        <!-- 1. ROLE SELECTION SCREEN                  -->
        <!-- ========================================== -->
        <div id="screenRoleSelect" class="max-w-2xl mx-auto w-full bg-white/95 border-4 border-sky-300 rounded-3xl p-8 shadow-2xl text-center my-auto">
            <div class="inline-block bg-amber-100 text-amber-600 p-4 rounded-full mb-3 shadow-sm">
                <i class="fa-solid fa-shapes text-5xl"></i>
            </div>
            <h2 class="text-3xl font-black text-slate-800 mb-2">歡迎來到課堂溫習系統！</h2>
            <p class="text-slate-600 mb-8 font-bold text-lg">請選擇你的身份進入程式：</p>

            <div class="grid grid-cols-2 gap-6">
                <!-- Student Card Button -->
                <button onclick="selectRole('student')" class="group bg-gradient-to-b from-teal-400 to-teal-500 hover:from-teal-300 hover:to-teal-400 text-white p-6 rounded-3xl shadow-xl border-b-8 border-teal-700 active:translate-y-1 active:border-b-4 transition flex flex-col items-center justify-center">
                    <div class="bg-white/20 p-4 rounded-2xl mb-3 group-hover:scale-110 transition">
                        <i class="fa-solid fa-user-astronaut text-5xl text-white"></i>
                    </div>
                    <span class="text-3xl font-black mb-1">同學端 🎓</span>
                    <span class="text-xs bg-teal-800/30 px-3 py-1 rounded-full font-bold">輸入組別名稱 ‧ 提交答案</span>
                </button>

                <!-- Teacher Card Button -->
                <button onclick="selectRole('teacher')" class="group bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-400 hover:to-indigo-500 text-white p-6 rounded-3xl shadow-xl border-b-8 border-indigo-800 active:translate-y-1 active:border-b-4 transition flex flex-col items-center justify-center">
                    <div class="bg-white/20 p-4 rounded-2xl mb-3 group-hover:scale-110 transition">
                        <i class="fa-solid fa-chalkboard-user text-5xl text-white"></i>
                    </div>
                    <span class="text-3xl font-black mb-1">教師端 👩‍🏫</span>
                    <span class="text-xs bg-indigo-900/30 px-3 py-1 rounded-full font-bold">8 格大螢幕展示 ‧ 即時評分</span>
                </button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 2. STUDENT LOGIN SCREEN                   -->
        <!-- ========================================== -->
        <div id="screenStudentLogin" class="hidden max-w-lg mx-auto w-full bg-white border-4 border-teal-300 rounded-3xl p-8 shadow-2xl my-auto">
            <div class="text-center mb-6">
                <span class="bg-teal-100 text-teal-800 px-4 py-1.5 rounded-full font-black text-sm">步驟 1 / 2</span>
                <h2 class="text-3xl font-black text-slate-800 mt-2">請輸入學生資料</h2>
            </div>

            <form onsubmit="confirmStudentLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-slate-700 font-black mb-2 text-lg">1. 選擇你的組別：</label>
                    <select id="inputGroupSelect" required class="w-full text-xl p-3.5 border-3 border-slate-300 rounded-2xl focus:border-teal-500 focus:ring-4 focus:ring-teal-100 font-black text-slate-800 bg-slate-50 outline-none">
                        <option value="" disabled selected>-- 請選擇組別 (第1至8組) --</option>
                        <option value="1">第一組 (Group 1)</option>
                        <option value="2">第二組 (Group 2)</option>
                        <option value="3">第三組 (Group 3)</option>
                        <option value="4">第四組 (Group 4)</option>
                        <option value="5">第五組 (Group 5)</option>
                        <option value="6">第六組 (Group 6)</option>
                        <option value="7">第七組 (Group 7)</option>
                        <option value="8">第八組 (Group 8)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-slate-700 font-black mb-2 text-lg">2. 組員姓名（可以填寫多位）：</label>
                    <input type="text" id="inputStudentName" placeholder="例如：陳小明、張大華" required
                           class="w-full text-xl p-3.5 border-3 border-slate-300 rounded-2xl focus:border-teal-500 focus:ring-4 focus:ring-teal-100 font-bold text-slate-800 bg-slate-50 outline-none">
                </div>

                <button type="submit" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-black text-2xl py-4 rounded-2xl shadow-lg border-b-6 border-teal-700 transition active:translate-y-1">
                    開始答題 <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </form>
        </div>

        <!-- ========================================== -->
        <!-- 3. STUDENT WORKSPACE INTERFACE             -->
        <!-- ========================================== -->
        <div id="screenStudentWorkspace" class="hidden flex-1 flex flex-col max-w-5xl mx-auto w-full h-full">
            <!-- Top Group Info Header -->
            <div class="bg-white border-3 border-teal-300 rounded-2xl p-3.5 mb-3 shadow-sm flex justify-between items-center shrink-0">
                <div class="flex items-center gap-4">
                    <span id="studentGroupTag" class="bg-teal-500 text-white px-5 py-1.5 rounded-xl font-black text-xl shadow-sm">第 - 組</span>
                    <span id="studentNameTag" class="text-slate-800 font-black text-lg"><i class="fa-solid fa-users text-teal-500 mr-1.5"></i> 組員：-</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="bg-emerald-100 text-emerald-800 border border-emerald-300 px-3.5 py-1 rounded-full text-sm font-black flex items-center gap-2">
                        <span class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span> Chrome 實時連線中
                    </span>
                </div>
            </div>

            <!-- Answer Input Frame Card -->
            <div class="bg-white border-4 border-teal-400 rounded-3xl p-5 shadow-xl flex-1 flex flex-col relative overflow-hidden">
                <div class="flex justify-between items-center mb-2 shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="bg-amber-400 text-white p-2 rounded-xl">
                            <i class="fa-solid fa-pen-to-square text-xl"></i>
                        </div>
                        <h3 class="text-2xl font-black text-slate-800">答題框架</h3>
                    </div>
                    <span class="text-sm font-bold text-slate-400">請看課室大螢幕題目，並在此輸入答案</span>
                </div>

                <textarea id="studentAnswerInput" oninput="handleStudentInput()" placeholder="請在此處輸入你們小組的答案...&#10;1. &#10;2. "
                          class="w-full flex-1 p-4 text-2xl border-3 border-slate-200 rounded-2xl focus:border-teal-400 focus:ring-4 focus:ring-teal-100 outline-none resize-none font-bold text-slate-800 leading-relaxed bg-slate-50/50"></textarea>

                <div class="mt-3 flex justify-between items-center shrink-0">
                    <div class="text-base font-black text-slate-600">
                        目前字數：<span id="charCount" class="text-teal-600 text-xl">0</span> 字
                    </div>
                    <button onclick="manualSubmit()" class="bg-teal-500 hover:bg-teal-600 text-white font-black text-xl px-8 py-3 rounded-2xl shadow-md border-b-4 border-teal-700 active:translate-y-0.5 transition flex items-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> 確認發送給老師
                    </button>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 4. TEACHER DASHBOARD (LANDSCAPE 8-GRID)   -->
        <!-- ========================================== -->
        <div id="screenTeacherDashboard" class="hidden flex-1 flex flex-col h-full overflow-hidden">
            <!-- Control Header Bar -->
            <div class="bg-white border-3 border-indigo-200 rounded-2xl p-3 mb-3 shadow-sm flex justify-between items-center shrink-0">
                <div class="flex items-center gap-3">
                    <span class="bg-indigo-600 text-white p-2.5 rounded-xl">
                        <i class="fa-solid fa-tv text-2xl"></i>
                    </span>
                    <div>
                        <h2 class="text-2xl font-black text-slate-800 leading-none">全班小組答案總覽 (8 小組)</h2>
                        <p class="text-xs text-slate-500 font-bold mt-1">適用於大螢幕 / 投影機 ‧ 實時同步顯示與星級評分</p>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="toggleFontSize()" class="bg-slate-100 hover:bg-slate-200 text-slate-800 px-3.5 py-2 rounded-xl text-sm font-black border border-slate-300 transition">
                        <i class="fa-solid fa-text-height"></i> 切換字體大小
                    </button>
                    <button onclick="clearAllDataModal()" class="bg-red-50 hover:bg-red-100 text-red-600 px-3.5 py-2 rounded-xl text-sm font-black border border-red-200 transition">
                        <i class="fa-solid fa-trash-can"></i> 清空全班答案
                    </button>
                    <button onclick="exportResults()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-black shadow transition flex items-center gap-2">
                        <i class="fa-solid fa-file-export"></i> 匯出評分紀錄 (.txt)
                    </button>
                </div>
            </div>

            <!-- Landscape 8-Grid Display (4 Columns x 2 Rows) -->
            <div id="teacherGrid" class="grid grid-cols-4 grid-rows-2 gap-3 flex-1 overflow-y-auto pb-1">
                <!-- Dynamically Rendered by JS -->
            </div>
        </div>

    </main>

    <!-- CUSTOM MODAL -->
    <div id="customModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border-4 border-sky-300 text-center transform transition-all">
            <div id="modalIcon" class="text-5xl mb-3 text-sky-500">
                <i class="fa-solid fa-circle-info"></i>
            </div>
            <h3 id="modalTitle" class="text-2xl font-black text-slate-800 mb-2">提示</h3>
            <p id="modalMessage" class="text-slate-600 text-base font-bold mb-6">訊息內容...</p>
            <div id="modalButtons" class="flex justify-center gap-3">
                <button onclick="closeModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-black px-6 py-2.5 rounded-xl text-base transition">關閉</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const APP_KEY = 'hk_p3_review_app_data_v2';
        const channel = new BroadcastChannel('p3_classroom_chrome_channel');

        let state = {
            currentRole: null, 
            currentGroup: null, 
            currentStudentName: '',
            fontSizeLarge: false, 
            groups: {} 
        };

        function initGroupsState() {
            const initialGroups = {};
            for (let i = 1; i <= 8; i++) {
                initialGroups[i] = {
                    name: "",
                    answer: "",
                    score: 0,
                    stickers: [],
                    updatedAt: null
                };
            }
            return initialGroups;
        }

        function loadSavedState() {
            const saved = localStorage.getItem(APP_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.groups = parsed.groups || initGroupsState();
                } catch(e) {
                    state.groups = initGroupsState();
                }
            } else {
                state.groups = initGroupsState();
            }
        }

        function saveAndBroadcastState() {
            localStorage.setItem(APP_KEY, JSON.stringify({ groups: state.groups }));
            channel.postMessage({ type: 'STATE_UPDATE', groups: state.groups });
        }

        channel.onmessage = (event) => {
            if (event.data && event.data.type === 'STATE_UPDATE') {
                state.groups = event.data.groups;
                if (state.currentRole === 'teacher') {
                    renderTeacherGrid();
                }
            }
        };

        window.addEventListener('storage', (e) => {
            if (e.key === APP_KEY && e.newValue) {
                const parsed = JSON.parse(e.newValue);
                state.groups = parsed.groups || initGroupsState();
                if (state.currentRole === 'teacher') renderTeacherGrid();
            }
        });

        function showScreen(screenId) {
            document.getElementById('screenRoleSelect').classList.add('hidden');
            document.getElementById('screenStudentLogin').classList.add('hidden');
            document.getElementById('screenStudentWorkspace').classList.add('hidden');
            document.getElementById('screenTeacherDashboard').classList.add('hidden');

            document.getElementById(screenId).classList.remove('hidden');
        }

        function selectRole(role) {
            state.currentRole = role;
            const badge = document.getElementById('roleBadge');
            badge.classList.remove('hidden');

            if (role === 'student') {
                badge.className = "px-4 py-1 rounded-full text-sm font-black bg-teal-100 text-teal-800 border border-teal-300";
                badge.innerHTML = '<i class="fa-solid fa-user-astronaut mr-1"></i> 同學端 🎓';
                showScreen('screenStudentLogin');
            } else if (role === 'teacher') {
                badge.className = "px-4 py-1 rounded-full text-sm font-black bg-indigo-100 text-indigo-800 border border-indigo-300";
                badge.innerHTML = '<i class="fa-solid fa-chalkboard-user mr-1"></i> 教師端 👩‍🏫';
                showScreen('screenTeacherDashboard');
                renderTeacherGrid();
            }
        }

        function switchRole() {
            state.currentRole = null;
            document.getElementById('roleBadge').classList.add('hidden');
            showScreen('screenRoleSelect');
        }

        function confirmStudentLogin(event) {
            event.preventDefault();
            const groupVal = document.getElementById('inputGroupSelect').value;
            const nameVal = document.getElementById('inputStudentName').value.trim();

            if (!groupVal || !nameVal) {
                showAlert('提示', '請選取組別並輸入組員姓名！');
                return;
            }

            state.currentGroup = groupVal;
            state.currentStudentName = nameVal;

            if (!state.groups[groupVal]) {
                state.groups[groupVal] = { name: nameVal, answer: "", score: 0, stickers: [], updatedAt: null };
            } else {
                state.groups[groupVal].name = nameVal;
            }
            saveAndBroadcastState();

            document.getElementById('studentGroupTag').textContent = `第 ${groupVal} 組`;
            document.getElementById('studentNameTag').innerHTML = `<i class="fa-solid fa-users text-teal-500 mr-1.5"></i> 組員：${escapeHtml(nameVal)}`;

            const existingAnswer = state.groups[groupVal].answer || "";
            const textarea = document.getElementById('studentAnswerInput');
            textarea.value = existingAnswer;
            document.getElementById('charCount').textContent = existingAnswer.length;

            showScreen('screenStudentWorkspace');
        }

        function handleStudentInput() {
            if (!state.currentGroup) return;
            const text = document.getElementById('studentAnswerInput').value;
            document.getElementById('charCount').textContent = text.length;

            state.groups[state.currentGroup].answer = text;
            state.groups[state.currentGroup].updatedAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            saveAndBroadcastState();
        }

        function manualSubmit() {
            handleStudentInput();
            showAlert('成功發送', `第 ${state.currentGroup} 組答案已傳送至老師大螢幕！`, 'fa-circle-check', 'text-emerald-500');
        }

        function renderTeacherGrid() {
            const grid = document.getElementById('teacherGrid');
            grid.innerHTML = '';

            const availableStickers = [
                { label: '👍 讚！', color: 'bg-amber-100 text-amber-900 border-amber-300' },
                { label: '🌟 結構清晰', color: 'bg-emerald-100 text-emerald-900 border-emerald-300' },
                { label: '✨ 創意無限', color: 'bg-purple-100 text-purple-900 border-purple-300' },
                { label: '💯 極佳示範', color: 'bg-rose-100 text-rose-900 border-rose-300' }
            ];

            const fontClass = state.fontSizeLarge ? 'text-2xl' : 'text-base';

            for (let i = 1; i <= 8; i++) {
                const groupData = state.groups[i] || { name: "", answer: "", score: 0, stickers: [], updatedAt: null };
                const hasAnswer = groupData.answer && groupData.answer.trim().length > 0;

                const card = document.createElement('div');
                card.className = `bg-white border-3 ${hasAnswer ? 'border-indigo-400 shadow-md' : 'border-slate-200'} rounded-2xl p-3 flex flex-col justify-between overflow-hidden`;

                let starsHtml = '';
                for (let s = 1; s <= 5; s++) {
                    const active = s <= (groupData.score || 0);
                    starsHtml += `<button onclick="rateGroup(${i}, ${s})" class="text-xl ${active ? 'text-amber-400 hover:scale-125' : 'text-slate-300 hover:text-amber-200'} transition transform focus:outline-none">★</button>`;
                }

                let activeStickersHtml = (groupData.stickers || []).map(st => `
                    <span class="inline-flex items-center text-xs px-2 py-0.5 rounded-md border font-black bg-amber-100 text-amber-900 border-amber-300 shadow-sm animate-pulse">
                        ${st}
                    </span>
                `).join('');

                card.innerHTML = `
                    <div class="flex flex-col h-full justify-between">
                        <div>
                            <!-- Header -->
                            <div class="flex justify-between items-center mb-1.5 border-b border-slate-100 pb-1">
                                <div class="flex items-center gap-1.5">
                                    <span class="bg-indigo-600 text-white font-black px-2.5 py-0.5 rounded-lg text-xs">第 ${i} 組</span>
                                    <span class="text-xs font-black text-slate-700 truncate max-w-[100px]" title="${escapeHtml(groupData.name || '未填寫')}">
                                        ${escapeHtml(groupData.name || '未加入')}
                                    </span>
                                </div>
                                <span class="text-[10px] font-black ${hasAnswer ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-slate-400 bg-slate-50 border-slate-200'} px-2 py-0.5 rounded-full border">
                                    ${hasAnswer ? '已交' : '未交'}
                                </span>
                            </div>

                            <!-- Content Display Area -->
                            <div class="bg-slate-50 border border-slate-200 rounded-xl p-2.5 h-[100px] overflow-y-auto mb-2">
                                <p class="${fontClass} font-bold text-slate-800 whitespace-pre-wrap leading-relaxed">
                                    ${hasAnswer ? escapeHtml(groupData.answer) : '<span class="text-slate-300 italic text-xs">等待組員輸入答案...</span>'}
                                </p>
                            </div>
                        </div>

                        <!-- Grading Controls -->
                        <div class="space-y-1.5 pt-1 border-t border-slate-100">
                            ${activeStickersHtml ? `<div class="flex flex-wrap gap-1">${activeStickersHtml}</div>` : ''}

                            <div class="flex justify-between items-center bg-slate-50 px-2 py-1 rounded-lg">
                                <span class="text-[11px] font-black text-slate-500">評分:</span>
                                <div class="flex gap-0.5">${starsHtml}</div>
                            </div>

                            <div class="grid grid-cols-2 gap-1">
                                ${availableStickers.map(s => `
                                    <button onclick="toggleSticker(${i}, '${s.label}')" class="text-[10px] font-black px-1.5 py-1 rounded-md border ${s.color} hover:opacity-80 transition truncate">
                                        ${s.label}
                                    </button>
                                me`).join('')}
                            </div>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            }
        }

        function rateGroup(groupNum, score) {
            if (!state.groups[groupNum]) state.groups[groupNum] = { name: "", answer: "", score: 0, stickers: [] };
            state.groups[groupNum].score = state.groups[groupNum].score === score ? 0 : score;
            saveAndBroadcastState();
            renderTeacherGrid();
        }

        function toggleSticker(groupNum, stickerLabel) {
            if (!state.groups[groupNum]) state.groups[groupNum] = { name: "", answer: "", score: 0, stickers: [] };
            let stickers = state.groups[groupNum].stickers || [];
            if (stickers.includes(stickerLabel)) {
                stickers = stickers.filter(s => s !== stickerLabel);
            } else {
                stickers.push(stickerLabel);
            }
            state.groups[groupNum].stickers = stickers;
            saveAndBroadcastState();
            renderTeacherGrid();
        }

        function toggleFontSize() {
            state.fontSizeLarge = !state.fontSizeLarge;
            renderTeacherGrid();
        }

        function clearAllDataModal() {
            showConfirmModal('確定要清空嗎？', '將會清空全班 8 個小組的答案與評分紀錄。', () => {
                state.groups = initGroupsState();
                saveAndBroadcastState();
                renderTeacherGrid();
                showAlert('已完成', '所有小組答案已清空！', 'fa-circle-check', 'text-emerald-500');
            });
        }

        function exportResults() {
            let summary = "=== 香港小學三年級單元總結溫習 - 評分紀錄 ===\n\n";
            for (let i = 1; i <= 8; i++) {
                const g = state.groups[i] || { name: "未填寫", answer: "無", score: 0, stickers: [] };
                summary += `【第 ${i} 組】\n`;
                summary += `組員：${g.name || "未填寫"}\n`;
                summary += `評分：${'★'.repeat(g.score || 0)}${'☆'.repeat(5 - (g.score || 0))} (${g.score || 0}/5 星)\n`;
                summary += `貼紙：${(g.stickers && g.stickers.length > 0) ? g.stickers.join(', ') : '無'}\n`;
                summary += `答案內容：\n${g.answer || "無內容"}\n`;
                summary += "--------------------------------------------------\n";
            }

            const blob = new Blob([summary], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `小三溫習小組評分總結_${new Date().toISOString().slice(0,10)}.txt`;
            link.click();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function showAlert(title, message, iconClass = 'fa-circle-info', iconColor = 'text-sky-500') {
            const modal = document.getElementById('customModal');
            document.getElementById('modalIcon').className = `text-5xl mb-3 ${iconColor}`;
            document.getElementById('modalIcon').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;

            const btns = document.getElementById('modalButtons');
            btns.innerHTML = `<button onclick="closeModal()" class="bg-sky-500 hover:bg-sky-600 text-white font-black px-6 py-2.5 rounded-xl text-base transition shadow-md">確定</button>`;

            modal.classList.remove('hidden');
        }

        function showConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById('customModal');
            document.getElementById('modalIcon').className = 'text-5xl mb-3 text-amber-500';
            document.getElementById('modalIcon').innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i>`;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;

            const btns = document.getElementById('modalButtons');
            btns.innerHTML = `
                <button onclick="closeModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-black px-4 py-2 rounded-xl text-base transition">取消</button>
                <button id="modalConfirmBtn" class="bg-red-500 hover:bg-red-600 text-white font-black px-5 py-2 rounded-xl text-base transition shadow-md">確定清空</button>
            `;

            document.getElementById('modalConfirmBtn').onclick = () => {
                closeModal();
                onConfirm();
            };

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        window.onload = function() {
            loadSavedState();
        };
    </script>
</body>
</html>
